<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protótipo: visão de cima — Phandalin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; --fundo:#14121a; --painel:#1d1a25; --borda:#3a3446; --texto:#e9e4d9; --suave:#9a93a6; --ouro:#d9b45a; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font: 13px/1.4 system-ui, sans-serif; }
      #raiz { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
      header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: var(--painel); border-bottom: 1px solid var(--borda); }
      header h1 { font-size: 15px; margin: 0 10px 0 0; color: var(--ouro); }
      button, select { background: #2a2634; color: var(--texto); border: 1px solid var(--borda); border-radius: 5px; padding: 5px 9px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--ouro); }
      button.on { background: #4a3f22; border-color: var(--ouro); color: #fff; }
      label.linha { display: flex; gap: 5px; align-items: center; }
      #area { overflow: auto; position: relative; background: #0d0c11; }
      #area canvas { display: block; }
      footer { padding: 6px 10px; background: var(--painel); border-top: 1px solid var(--borda); color: var(--suave); }
    </style>
  </head>
  <body>
    <div id="raiz">
      <header>
        <h1>Visão de cima — protótipo</h1>
        <select id="mapa"></select>
        <button id="modo" class="on">Visão de cima</button>
        <label class="linha"><input type="checkbox" id="grade" checked /> Grade</label>
        <label class="linha"><input type="checkbox" id="moveis" checked /> Móveis</label>
        <label class="linha"><input type="checkbox" id="arestas" /> Paredes à mostra (como o editor do Foundry)</label>
        <button id="menos">−</button><button id="mais">+</button>
      </header>
      <div id="area"><canvas id="tela"></canvas></div>
      <footer id="rodape">—</footer>
    </div>
    <script type="module" src="/src/dev/topo.js"></script>
  </body>
</html>
