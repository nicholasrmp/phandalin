<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phandalin — oficina de personagens</title>
<style>
  :root {
    --fundo: #15121a;
    --painel: #1e1a26;
    --borda: #332b40;
    --texto: #e8e2d4;
    --fraco: #a79cb0;
    --ouro: #c9a227;
    --chao: #4e4a56;
  }
  body.claro {
    --fundo: #ded6c6;
    --painel: #ece5d6;
    --borda: #c2b8a4;
    --texto: #2a2420;
    --fraco: #6a6152;
    --chao: #b9af99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--fundo); color: var(--texto);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    transition: background .2s;
  }
  .topo { max-width: 1120px; margin: 0 auto 28px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .3px; }
  .topo p { margin: 0 0 14px; color: var(--fraco); max-width: 70ch; }
  button {
    background: var(--painel); color: var(--texto);
    border: 1px solid var(--borda); border-radius: 7px;
    padding: 7px 14px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--ouro); }

  #opcoes { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
  .card {
    background: var(--painel); border: 1px solid var(--borda);
    border-radius: 12px; padding: 20px 22px 22px;
  }
  .tag {
    display: inline-block; font-size: 11px; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--ouro);
    border: 1px solid var(--ouro); border-radius: 4px;
    padding: 2px 8px; margin-bottom: 8px;
  }
  .card h2 { margin: 0 0 6px; font-size: 21px; }
  .pitch { margin: 0 0 18px; color: var(--fraco); max-width: 78ch; }
  .card h3 {
    font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--fraco); margin: 22px 0 10px; font-weight: 600;
  }

  .elenco, .fila { display: flex; flex-wrap: wrap; gap: 10px; }
  .cel {
    margin: 0; background: var(--chao);
    border: 1px solid var(--borda); border-radius: 9px;
    padding: 8px 8px 6px; text-align: center; min-width: 140px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .cel.inimigo { border-color: #6b2a2a; }
  .cel.heroi { border-color: #2a4a6b; }
  body.claro .cel.inimigo { border-color: #a6534a; }
  body.claro .cel.heroi { border-color: #5a7fa6; }
  .fig { display: block; margin: 0 auto 6px; image-rendering: pixelated; }
  figcaption { font-size: 11px; line-height: 1.3; }
  figcaption b { display: block; }
  figcaption span { color: var(--fraco); display: block; }
  figcaption .alt { color: var(--ouro); font-variant-numeric: tabular-nums; }

  .fila-real { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  .grupo-real {
    display: flex; align-items: flex-end; gap: 4px;
    background: var(--chao); border: 1px solid var(--borda);
    border-radius: 9px; padding: 8px 10px;
  }
  .grupo-real .fig { margin: 0; }
  .lab { font-size: 11px; color: var(--fraco); align-self: flex-end; margin-left: 4px; }

  .juizo { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
  .juizo ul { margin: 0; padding-left: 20px; font-size: 13.5px; }
  .juizo li { margin-bottom: 4px; }
  .pros li::marker { color: #6aa84f; }
  .cons li::marker { color: #cc6a4a; }
  .cons { color: var(--fraco); }
  @media (max-width: 720px) { .juizo { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="topo">
    <h1>Oficina de personagens</h1>
    <p>
      Esta página desenha com o mesmo pintor do jogo. A anatomia é paramétrica: espécie e
      compleição viram medidas em pixels, então goblin não é humano verde e hobgoblin não é
      humano de armadura. Equipamento é um campo do look, não arte nova.
    </p>
    <button id="tema">Fundo claro</button>
  </div>
  <div id="opcoes"></div>
  <script type="module" src="/src/dev/char-styles-preview.js"></script>
</body>
</html>
