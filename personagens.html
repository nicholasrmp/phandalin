<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phandalin — folha de revisão do elenco</title>
<style>
  :root {
    --fundo: #15121a; --painel: #1e1a26; --borda: #332b40;
    --texto: #e8e2d4; --fraco: #a79cb0; --ouro: #c9a227; --chao: #4e4a56;
  }
  body.claro {
    --fundo: #ded6c6; --painel: #ece5d6; --borda: #c2b8a4;
    --texto: #2a2420; --fraco: #6a6152; --chao: #b9af99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 64px;
    background: var(--fundo); color: var(--texto);
    font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  .topo { max-width: 1400px; margin: 0 auto 20px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .topo p { margin: 0 0 12px; color: var(--fraco); max-width: 76ch; }
  button {
    background: var(--painel); color: var(--texto); border: 1px solid var(--borda);
    border-radius: 7px; padding: 7px 14px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--ouro); }

  #opcoes { max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; }
  .card {
    background: var(--painel); border: 1px solid var(--borda);
    border-radius: 12px; padding: 16px 18px 18px;
  }
  .card h2 { margin: 0 0 12px; font-size: 19px; }
  .qtd {
    font-size: 12px; color: var(--fraco); border: 1px solid var(--borda);
    border-radius: 20px; padding: 1px 9px; margin-left: 6px; vertical-align: 2px;
  }
  .pitch { margin: 0 0 12px; color: var(--fraco); max-width: 80ch; }

  .fila { display: flex; flex-wrap: wrap; gap: 10px; }
  .cel {
    margin: 0; background: var(--chao); border: 1px solid var(--borda);
    border-radius: 9px; padding: 6px 6px 8px; text-align: center;
    width: 330px; scroll-margin-top: 20px;
  }
  .cel.inimigo { border-color: #6b2a2a; }
  .cel.heroi   { border-color: #2a4a6b; }
  .cel.npc     { border-color: #4a6b3a; }
  body.claro .cel.inimigo { border-color: #a6534a; }
  body.claro .cel.heroi   { border-color: #5a7fa6; }
  body.claro .cel.npc     { border-color: #6f9456; }

  .par { display: flex; justify-content: center; gap: 2px; }
  .fig { display: block; image-rendering: pixelated; }

  figcaption { font-size: 12px; line-height: 1.35; margin-top: 4px; text-align: left; padding: 0 4px; }
  figcaption b { display: block; font-size: 13px; }
  .num {
    display: inline-block; min-width: 24px; margin-right: 6px; padding: 0 5px;
    background: var(--ouro); color: #1b1710; border-radius: 4px;
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .chave { display: block; color: var(--fraco); font-family: ui-monospace, monospace; font-size: 11px; }
  .medida { display: block; color: var(--fraco); }
  .fonte {
    display: inline-block; margin-top: 3px; font-size: 10.5px; letter-spacing: .5px;
    text-transform: uppercase; border: 1px solid var(--ouro); color: var(--ouro);
    border-radius: 4px; padding: 0 5px;
  }
  .aviso {
    display: block; margin-top: 3px; font-size: 11px;
    border-left: 3px solid #cc6a4a; padding-left: 6px; color: #e0a68e;
  }
  .aviso.erro { border-color: #e04a4a; color: #ff9a9a; }
  body.claro .aviso { color: #9a4526; }
  body.claro .aviso.erro { color: #a81f1f; }

  .resumo h2 { color: var(--ouro); }
  .lista-problemas { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; columns: 2; }
  .lista-problemas li { margin-bottom: 4px; break-inside: avoid; }
  .lista-problemas a { color: var(--texto); }
  @media (max-width: 760px) { .lista-problemas { columns: 1; } .cel { width: 100%; } }
</style>
</head>
<body>
  <div class="topo">
    <h1>Folha de revisão do elenco</h1>
    <p>
      Desenhado com o mesmo pintor do jogo. Cada figura aparece de frente e de lado —
      a câmera gira, então as duas vistas chegam ao jogador. A altura é medida do alfa
      do canvas, não declarada. <b>Para pedir mudança, cite o número.</b>
    </p>
    <button id="tema">Fundo claro</button>
  </div>
  <div id="opcoes"></div>
  <script type="module" src="/src/dev/char-styles-preview.js"></script>
</body>
</html>
