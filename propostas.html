<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phandalin — quatro propostas para o goblin</title>
<style>
  :root { --fundo:#14100b; --painel:#1e1a14; --borda:#3a3024; --texto:#ebe2d0; --fraco:#a2957c; --ouro:#c9a227; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 64px; background:var(--fundo); color:var(--texto);
         font:15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .topo { max-width:1200px; margin:0 auto 22px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .topo p { margin:0 0 12px; color:var(--fraco); max-width:78ch; }
  button { background:var(--painel); color:var(--texto); border:1px solid var(--borda);
           border-radius:7px; padding:6px 14px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--ouro); }
  #propostas { max-width:1200px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .proposta { background:var(--painel); border:1px solid var(--borda); border-radius:12px; padding:14px 16px 18px; }
  .proposta h2 { font-size:17px; margin:0 0 4px; color:var(--ouro); }
  .proposta header p { margin:0 0 2px; color:var(--fraco); max-width:80ch; }
  .medida { font-variant-numeric:tabular-nums; font-size:13px; color:#8e8371; }
  .tira { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-top:10px; }
  figure { margin:0; text-align:center; }
  figure canvas { display:block; background:#241d16; border-radius:6px; }
  figcaption { font-size:12px; color:var(--fraco); margin-top:4px; }
</style>
</head>
<body>
  <div class="topo">
    <h1>Quatro propostas para o goblin</h1>
    <p>Desenhadas com o pintor do jogo, na resolução da folha de sprites — a que for
       escolhida já nasce animando nos vinte e um quadros. A primeira fileira é o
       goblin como está hoje, para a comparação ficar honesta.</p>
    <p><button id="menos">menor</button> <button id="mais">maior</button></p>
  </div>
  <div id="propostas"></div>
  <script type="module" src="/src/dev/propostas.js"></script>
</body>
</html>
